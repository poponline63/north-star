<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="north-star: a constellation from star, to prompt, to run, to evidence, ending at the north star, which is the gate. Exit 0 means every requirement is met; exit 1 keeps going and names the weakest requirement.">
  <title>north-star</title>
  <defs>
    <radialGradient id="bg" cx="78%" cy="18%" r="95%">
      <stop offset="0" stop-color="#16213d"/><stop offset=".45" stop-color="#0b1224"/><stop offset="1" stop-color="#05080f"/>
    </radialGradient>
    <radialGradient id="aurora" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd479" stop-opacity=".22"/><stop offset="1" stop-color="#ffd479" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe7a8" stop-opacity=".55"/><stop offset="1" stop-color="#ffe7a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodehalo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9ec5ff" stop-opacity=".45"/><stop offset="1" stop-color="#9ec5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#ffd479"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .tw { animation: twinkle 4s ease-in-out infinite; }
    .path { animation: march 2.4s linear infinite; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes twinkle { 50% { opacity: .12; } }
    @keyframes march { to { stroke-dashoffset: -32; } }
    @keyframes pulse { 50% { opacity: .5; transform: scale(.86); } }
    @media (prefers-reduced-motion: reduce) { .tw, .path, .pulse { animation: none; } }
  </style>
